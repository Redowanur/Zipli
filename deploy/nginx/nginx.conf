worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    # Behind a TLS proxy (Caddy) the TCP peer is a private Docker address, so
    # trust X-Forwarded-For from private ranges only. Without this, per-IP rate
    # limits and click analytics would all see the proxy's IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker's embedded DNS; re-resolve so scaling/restarts of api/web are picked up.
    resolver 127.0.0.11 valid=5s ipv6=off;

    log_format main '$remote_addr "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # Per-IP limits: redirects are generous, API writes are tight.
    limit_req_zone $binary_remote_addr zone=redirect:20m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=api:10m      rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m     rate=5r/s;
    limit_req_zone $binary_remote_addr zone=guest:10m    rate=10r/m;   # anonymous shortening
    limit_req_status 429;

    # Edge cache for static assets served by the web app (what a CDN would hold).
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:20m max_size=500m inactive=7d use_temp_path=off;

    upstream api_pool {
        zone api_pool 64k;
        server api:8080 resolve max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 80 default_server;

        # Pass real client info to upstreams; a CDN in front would set CF-IPCountry.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /nginx-health { access_log off; return 200 "ok\n"; }

        # ---- API ----
        location = /api/auth/login    { limit_req zone=auth burst=10 nodelay; proxy_pass http://api_pool; }
        location = /api/auth/register { limit_req zone=auth burst=10 nodelay; proxy_pass http://api_pool; }
        location ^~ /api/auth/google { limit_req zone=auth burst=10 nodelay; proxy_pass http://api_pool; }
        location = /api/links/public  { limit_req zone=guest burst=5 nodelay; proxy_pass http://api_pool; }
        location /api/                { limit_req zone=api burst=40 nodelay;  proxy_pass http://api_pool; }
        location = /healthz           { proxy_pass http://api_pool; }
        location = /readyz            { proxy_pass http://api_pool; }

        # ---- Web UI (Next.js) ----
        # Static, content-hashed assets: cache hard at the edge and in browsers.
        location /_next/static/ {
            set $web http://web:3000;
            proxy_pass $web;
            proxy_cache static;
            proxy_cache_valid 200 7d;
            proxy_cache_use_stale error timeout updating;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Cache $upstream_cache_status always;
        }
        location /static/ {
            set $web http://web:3000;
            proxy_pass $web;
            proxy_cache static;
            proxy_cache_valid 200 1d;
            add_header X-Cache $upstream_cache_status always;
        }
        location ^~ /dashboard { set $web http://web:3000; proxy_pass $web; }
        location ^~ /_next/    { set $web http://web:3000; proxy_pass $web; }
        location = /           { set $web http://web:3000; proxy_pass $web; }
        location = /login      { set $web http://web:3000; proxy_pass $web; }
        location = /auth/callback { set $web http://web:3000; proxy_pass $web; }
        location = /register   { set $web http://web:3000; proxy_pass $web; }
        location = /pricing    { set $web http://web:3000; proxy_pass $web; }
        location = /favicon.ico { set $web http://web:3000; proxy_pass $web; }
        location = /favicon.svg { set $web http://web:3000; proxy_pass $web; }

        # ---- Redirects: anything that looks like a short code ----
        # Not cached at the proxy on purpose: every hit must reach the API so
        # the click event is recorded. Redis makes the API lookup sub-ms.
        location ~ "^/[0-9A-Za-z_-]{3,32}$" {
            limit_req zone=redirect burst=400 nodelay;
            proxy_pass http://api_pool;
        }

        location / { return 404; }
    }
}
